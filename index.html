
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive viewport and iOS safe-area support -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Page information -->
    <title>Minesweeper | Fred Wahab</title>

    <meta
      name="description"
      content="Play Minesweeper online for free. A responsive browser game with Beginner, Intermediate, and Expert difficulties, built by Fred Wahab."
    />

    <meta
      name="theme-color"
      content="#101027"
    />

    <!-- Search engine indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://fredwahab.github.io/Minesweeper/"
    />

    <!-- Favicons -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon.svg"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%BASE_URL%apple-touch-icon.png"
    />

    <!-- iOS home screen support -->
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta name="mobile-web-app-capable" content="yes">
    
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Minesweeper"
    />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Minesweeper | Fred Wahab"
    />
    <meta
      property="og:description"
      content="Play a classic Minesweeper game with three difficulty levels, mobile-friendly controls, and responsive gameplay."
    />
    <meta
      property="og:url"
      content="https://fredwahab.github.io/Minesweeper/"
    />

  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
